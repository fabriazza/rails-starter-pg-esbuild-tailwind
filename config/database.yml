default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>


development:
  <<: *default
  database: rails_starter_development

test:
  <<: *default
  database: rails_starter_test

production:
  primary: &primary_production
    <<: *default
    database: rails_starter_production
    username: <%= ENV.fetch("POSTGRES_USER", "rails_starter") %>
    password: <%= ENV["POSTGRES_PASSWORD"] %>
    host: <%= ENV["POSTGRES_HOST"] %>
  cache:
    <<: *primary_production
    database: rails_starter_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: rails_starter_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: rails_starter_production_cable
    migrations_paths: db/cable_migrate
